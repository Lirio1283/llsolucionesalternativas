[build]
  command = "npm run verify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.22.0"
  SANITY_PROJECT_ID = "k56pw45w"
  SANITY_DATASET = "production"

[context.production.environment]
  REQUIRE_CMS = "true"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.llsolucionesalternativas.com/*"
  to = "https://llsolucionesalternativas.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://llsolucionesalternativas.netlify.app/*"
  to = "https://llsolucionesalternativas.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/cms-published"
  to = "/.netlify/functions/cms-published"
  status = 200

[[redirects]]
  from = "/api/preview"
  to = "/.netlify/functions/preview"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://cdn.sanity.io data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
