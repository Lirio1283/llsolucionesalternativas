name: Verify website
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run verify
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci --prefix studio
      - run: npm run check --prefix studio
      - run: npm run build --prefix studio
        env:
          SANITY_STUDIO_PROJECT_ID: localcheck
          SANITY_STUDIO_DATASET: production
